$kind: http-request
name: Create Razorpay Order
order: 2000
url: '{{base_url}}/api/payments/create-order'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{auth_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": 1000,
      "currency": "INR",
      "notes": {
        "purpose": "wallet_topup"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 503", () => {
        pm.expect(pm.response.code).to.be.oneOf([200, 201, 503]);
      });
      const json = pm.response.json();
      if (json.order && json.order.id) {
        pm.environment.set("razorpay_order_id", json.order.id);
      }
