$kind: http-request
name: Verify Deposit Manual
order: 6000
url: '{{base_url}}/api/admin/deposits/{{deposit_id}}/verify-manual'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "notes": "Manually verified via bank statement"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
