$kind: http-request
name: Get Audit Logs
order: 13000
url: '{{base_url}}/api/admin/audit-logs'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
