$kind: http-request
name: Reject Withdrawal
order: 10000
url: '{{base_url}}/api/admin/withdrawals/{{withdrawal_id}}/reject'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "Suspicious activity detected"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
