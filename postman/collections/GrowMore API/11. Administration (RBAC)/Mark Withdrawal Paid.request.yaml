$kind: http-request
name: Mark Withdrawal Paid
order: 9000
url: '{{base_url}}/api/admin/withdrawals/{{withdrawal_id}}/mark-paid'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
