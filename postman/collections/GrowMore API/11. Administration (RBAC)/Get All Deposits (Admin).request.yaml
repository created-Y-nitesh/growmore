$kind: http-request
name: 'Get All Deposits (Admin)'
order: 5000
url: '{{base_url}}/api/admin/deposits'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
