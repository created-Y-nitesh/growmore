$kind: http-request
name: Run Return Batch
order: 12000
url: '{{base_url}}/api/admin/returns/run-batch'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
