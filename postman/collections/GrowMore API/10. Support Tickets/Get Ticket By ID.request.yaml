$kind: http-request
name: Get Ticket By ID
order: 3000
url: '{{base_url}}/api/support/{{ticket_id}}'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{auth_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
