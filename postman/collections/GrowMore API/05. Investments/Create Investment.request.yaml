$kind: http-request
name: Create Investment
order: 1000
url: '{{base_url}}/api/investments'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{auth_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "planId": "{{plan_id}}",
      "amount": 5000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Investment created", () => {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      const json = pm.response.json();
      if (json.investment && json.investment.id) {
        pm.environment.set("investment_id", json.investment.id);
      }
