$kind: http-request
name: Get My Deposits
order: 2000
url: '{{base_url}}/api/deposits/my'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{auth_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Deposits list returned", () => {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
