$kind: http-request
name: Create Deposit
order: 1000
url: '{{base_url}}/api/deposits'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{auth_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": 1000,
      "paymentProvider": "UPI Instant Gateway",
      "providerReference": "UPI-REF-TEST-001"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Deposit created", () => {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
        pm.expect(json.deposit).to.be.an('object');
      });
      const json = pm.response.json();
      if (json.deposit && json.deposit.id) {
        pm.environment.set("deposit_id", json.deposit.id);
      }
