$kind: http-request
name: Logout
order: 3000
url: '{{base_url}}/api/auth/logout'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{auth_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
