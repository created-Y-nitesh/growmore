$kind: http-request
name: Reset Password
order: 7000
url: '{{base_url}}/api/auth/reset-password'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "phone": "9876543210",
      "otp": "123456",
      "newPassword": "NewPass@1234"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
