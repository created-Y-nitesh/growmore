$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Arjun Sharma",
      "email": "arjun.sharma@example.com",
      "password": "GrowMoreSecure#2026",
      "phone": "+919876543210",
      "dob": "1992-08-20",
      "referralCode": ""
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) { pm.collectionVariables.set('authToken', jsonData.token); }
    language: text/javascript
order: 1000
