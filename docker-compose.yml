version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: growmore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-growmore_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-v4l7n9w2a1}
    ports:
      - "5432:5432"
    volumes:
      - growmore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: growmore_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-growmore_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-v4l7n9w2a1}
      JWT_SECRET: ${JWT_SECRET:-growmore_sec_jwt_key_9f3b7c8e21a04d55b8}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PAYMENT_PROVIDER: disabled
      PAYOUT_PROVIDER: disabled
      ENABLE_LIVE_RETURN_CREDITING: "false"

volumes:
  growmore_pgdata:
